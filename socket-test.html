<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket.IO Test - GetALawyer</title>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
    input, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
    button { padding: 8px 16px; margin-right: 8px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { background: #f4f4f4; padding: 12px; height: 400px; overflow-y: auto; border: 1px solid #ddd; font-size: 12px; }
    .out { color: #2563eb; }
    .in  { color: #16a34a; }
    .err { color: #dc2626; }
    .section { background: white; padding: 16px; margin-bottom: 16px; border: 1px solid #e5e7eb; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Socket.IO Messaging Test</h2>
  
  <div class="section">
    <label>Backend API URL</label>
    <input id="apiUrl" value="http://localhost:3001" />
    
    <label>Session Token</label>
    <input id="token" placeholder="Paste your session token here" />
    
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <span id="status">● disconnected</span>
  </div>

  <div class="section">
    <label>Conversation ID</label>
    <input id="convId" placeholder="paste conversationId here" />
    <button onclick="joinRoom()">Join Room</button>
    <button onclick="leaveRoom()">Leave Room</button>
  </div>

  <div class="section">
    <label>Message</label>
    <input id="msgInput" placeholder="Hello, I need legal advice" />
    <button onclick="sendMessage()">Send Message</button>
  </div>

  <div class="section">
    <strong>Event Log</strong>
    <div id="log"></div>
    <button onclick="document.getElementById('log').innerHTML=''">Clear Log</button>
  </div>

  <script>
    let socket;

    function log(text, type = '') {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.innerHTML += `<div class="${type}">[${time}] ${text}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function connect() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const token = document.getElementById('token').value.trim();
      
      if (!token) {
        alert('Please paste your session token first');
        return;
      }

      socket = io(apiUrl, {
        auth: { token },
        transports: ['websocket'],
        withCredentials: true
      });

      socket.on('connect', () => {
        document.getElementById('status').textContent = '● connected  ' + socket.id;
        document.getElementById('status').style.color = 'green';
        log('✓ Connected: ' + socket.id, 'in');
      });

      socket.on('disconnect', (reason) => {
        document.getElementById('status').textContent = '● disconnected';
        document.getElementById('status').style.color = 'red';
        log('✗ Disconnected: ' + reason, 'err');
      });

      socket.on('connect_error', (err) => {
        log('✗ Connection error: ' + err.message, 'err');
      });

      socket.on('conversation:joined', (data) => {
        log('✓ Joined room: ' + JSON.stringify(data), 'in');
      });

      socket.on('message:new', (msg) => {
        log('📨 message:new → ' + JSON.stringify(msg), 'in');
      });

      socket.on('message:status', (data) => {
        log('📖 message:status → ' + JSON.stringify(data), 'in');
      });

      socket.on('notification:new', (data) => {
        log('🔔 notification:new → ' + JSON.stringify(data), 'in');
      });

      socket.on('typing:start', (data) => {
        log('⌨️  typing:start → ' + JSON.stringify(data), 'in');
      });

      socket.on('typing:stop', (data) => {
        log('⌨️  typing:stop → ' + JSON.stringify(data), 'in');
      });

      socket.on('error', (err) => {
        log('✗ Error: ' + JSON.stringify(err), 'err');
      });
    }

    function disconnect() {
      if (socket) {
        socket.disconnect();
      }
    }

    function joinRoom() {
      const convId = document.getElementById('convId').value.trim();
      if (!convId) {
        alert('Please enter a conversationId');
        return;
      }
      socket.emit('conversation:join', convId);
      log('→ conversation:join: ' + convId, 'out');
    }

    function leaveRoom() {
      const convId = document.getElementById('convId').value.trim();
      if (!convId) {
        alert('Please enter a conversationId');
        return;
      }
      socket.emit('conversation:leave', convId);
      log('→ conversation:leave: ' + convId, 'out');
    }

    function sendMessage() {
      const convId = document.getElementById('convId').value.trim();
      const content = document.getElementById('msgInput').value.trim();
      
      if (!convId || !content) {
        alert('Please fill in conversation ID and message');
        return;
      }
      
      socket.emit('message:send', { 
        conversationId: convId, 
        content 
      });
      log('→ message:send: ' + content, 'out');
      document.getElementById('msgInput').value = '';
    }
  </script>
</body>
</html>
