<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket Test</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 700px; }
    input, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
    button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
    #log { background: #f4f4f4; padding: 12px; height: 300px; overflow-y: auto; border: 1px solid #ddd; }
    .out { color: #2563eb; }
    .in  { color: #16a34a; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <h2>Socket.IO Messaging Test</h2>

  <label>Session Token (the short one from sign-in response)</label>
  <input id="token" placeholder="610OPm1TfhjtbKLUALPVPlHV5fL6KIGX" />

  <button onclick="connect()">Connect</button>
  <button onclick="disconnect()">Disconnect</button>
  <span id="status">● disconnected</span>

  <hr>

  <label>Conversation ID</label>
  <input id="convId" placeholder="paste conversationId here" />
  <button onclick="joinRoom()">Join Room</button>

  <hr>

  <label>Message</label>
  <input id="msgInput" placeholder="Hello, I need legal advice" />
  <button onclick="sendMessage()">Send</button>

  <hr>
  <strong>Log</strong>
  <div id="log"></div>
  <button onclick="document.getElementById('log').innerHTML=''">Clear</button>

  <script>
    let socket;

    function log(text, type = '') {
      const el = document.getElementById('log');
      el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${text}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function connect() {
      const token = document.getElementById('token').value.trim();
      if (!token) return alert('Paste your session token first');

      socket = io('http://localhost:3000', {
        auth: { token },
        transports: ['websocket']
      });

      socket.on('connect', () => {
        document.getElementById('status').textContent = '● connected  ' + socket.id;
        log('Connected: ' + socket.id, 'in');
      });

      socket.on('disconnect', () => {
        document.getElementById('status').textContent = '● disconnected';
        log('Disconnected', 'err');
      });

      socket.on('connect_error', (err) => {
        log('Connection error: ' + err.message, 'err');
      });

      socket.on('conversation:joined', (data) => {
        log('Joined room: ' + JSON.stringify(data), 'in');
      });

      socket.on('message:new', (msg) => {
        log('message:new → ' + JSON.stringify(msg), 'in');
      });

      socket.on('message:status', (data) => {
        log('message:status → ' + JSON.stringify(data), 'in');
      });

      socket.on('notification:new', (data) => {
        log('notification:new → ' + JSON.stringify(data), 'in');
      });

      socket.on('typing:start', (data) => {
        log('typing:start → ' + JSON.stringify(data), 'in');
      });

      socket.on('error', (err) => {
        log('Error: ' + JSON.stringify(err), 'err');
      });
    }

    function disconnect() {
      socket?.disconnect();
    }

    function joinRoom() {
      const convId = document.getElementById('convId').value.trim();
      if (!convId) return alert('Paste a conversationId');
      socket.emit('conversation:join', convId);
      log('conversation:join → ' + convId, 'out');
    }

    function sendMessage() {
      const convId = document.getElementById('convId').value.trim();
      const content = document.getElementById('msgInput').value.trim();
      if (!convId || !content) return alert('Fill in conversation ID and message');

      socket.emit('message:send', { conversationId: convId, content });
      log('message:send → ' + content, 'out');
    }
  </script>
</body>
</html>
